<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0077ff">
  <link rel="icon" href="/static/app_icon.png">
  <link rel="apple-touch-icon" href="/static/app_icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mental Mais">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Login — Mental Mais</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --navy:#0B0B2E;--navy2:#151846;--ink:#181A33;--ink-soft:#565C7C;
      --paper:#F3F5FA;--surface:#FFFFFF;--line:#DEE2EE;
      --teal:#20C4C6;--teal-dark:#0E8B8D;--teal-tint:#E3FAFA;
      --pink:#E85D75;--pink-tint:#FDEBEF;
      --green:#2FA97A;--amber:#EDA23B;--red:#D6503F;
      --font-sans:'Inter',system-ui,sans-serif;
      --font-serif:'Lora','Georgia',serif;
    }
    body{
      font-family:var(--font-sans);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--navy);
      padding:24px;
    }
    /* CARD (AZUL CLARO / PRETO COM TEXTO BRANCO EM NEGRITO) */
    .card{
      position:relative;z-index:1;
      background:linear-gradient(145deg, #07091d, #02030a) !important;
      border:1.5px solid #20C4C6 !important;
      border-radius:20px;
      padding:48px 44px 40px;
      width:100%;max-width:440px;
      box-shadow:0 8px 40px rgba(0,0,0,.8), 0 0 16px rgba(32,196,198,.2) !important;
      animation:slideUp .45s ease both;
    }
    .card, .card * {
      color:#ffffff !important;
      font-weight:700 !important;
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

    /* MASTHEAD */
    .masthead{
      text-align:center;margin-bottom:32px;
    }
    .logo-badge{
      display:inline-flex;align-items:center;gap:7px;
      background:rgba(32,196,198,.15);border:1.5px solid #20C4C6;
      font-size:11px;letter-spacing:2px;text-transform:uppercase;
      padding:5px 14px;border-radius:20px;margin-bottom:14px;
    }
    .logo-badge .dot{width:7px;height:7px;background:var(--teal);border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .masthead h1{
      font-family:var(--font-serif);
      font-size:30px;margin-bottom:4px;
    }
    .masthead h1 em{color:var(--teal) !important;font-style:normal}
    .masthead .sub{font-size:13px;opacity:.9}



    /* MSG */
    .msg{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
    .msg.error{background:rgba(214,80,63,.25);border:1.5px solid #ff6666}
    .msg.success{background:rgba(32,196,198,.25);border:1.5px solid #20C4C6}

    /* FIELDS */
    .field{margin-bottom:18px}
    label{font-size:11px;display:block;margin-bottom:7px;letter-spacing:.8px;text-transform:uppercase}
    .input-wrap{
      position:relative;background:#03050e;border:1.5px solid #20C4C6;
      border-radius:11px;display:flex;align-items:center;
      transition:border-color .2s,box-shadow .2s;
    }
    .input-wrap:focus-within{border-color:#38df9f;box-shadow:0 0 12px rgba(32,196,198,.4)}
    .input-icon{position:absolute;left:13px;flex-shrink:0}
    .input-wrap input{
      width:100%;padding:13px 13px 13px 42px;background:transparent;
      border:none;outline:none;font-size:14.5px;font-family:var(--font-sans);
    }
    .input-wrap input::placeholder{color:rgba(255,255,255,.5) !important}
    .toggle-pw{position:absolute;right:13px;cursor:pointer;background:none;border:none;font-size:16px}

    .forgot{text-align:right;margin-top:6px;margin-bottom:22px}
    .forgot a{font-size:12px;text-decoration:underline}
    .forgot a:hover{color:var(--teal) !important}

    /* BOTÃO */
    .btn-primary{
      width:100%;padding:14px;
      background:var(--teal);
      color:#000000 !important;border:1.5px solid var(--teal);border-radius:12px;
      font-size:15px;cursor:pointer;
      font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase;
      transition:all .25s;box-shadow:0 0 16px rgba(32,196,198,.4);
    }
    .btn-primary * { color: #000000 !important; }
    .btn-primary:hover{background:#3be2e4;border-color:#3be2e4;box-shadow:0 0 22px rgba(32,196,198,.7);transform:translateY(-1px)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.5;cursor:default;transform:none}

    .signup-link{text-align:center;margin-top:22px;font-size:13px}
    .signup-link a{text-decoration:underline}



    /* dots anim */
    .dots::after{content:'';animation:dots 1.2s infinite}
    @keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
  </style>
</head>
<body>
  <div class="card">
    <!-- Masthead -->
    <div class="masthead">
      <h1>Mental <em>Mais</em></h1>
      <div class="sub">Plataforma de Saúde Ocupacional Psicossocial · IA Engine</div>
    </div>



    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label>E-mail</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m2 7 10 7 10-7"/>
          </svg>
          <input type="email" id="email" placeholder="usuario@empresa.com.br" required autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()" title="Mostrar/ocultar senha">👁</button>
        </div>
      </div>
      <div class="forgot"><a href="#">Esqueci minha senha</a></div>
      <button type="submit" class="btn-primary" id="btn-login">
        <span class="btn-accent">⚡</span> ENTRAR
      </button>
    </form>

    <p class="signup-link">Não tem conta? <a href="/signup">Criar conta</a> &nbsp;|&nbsp; <a href="/cadastro-empresa">Cadastrar empresa</a></p>


  </div>

  <script>
    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('msg');
      btn.innerHTML = '<span class="btn-accent">⚡</span> <span class="dots">Verificando</span>';
      btn.disabled = true;
      msg.style.display = 'none';
      const fd = new FormData();
      fd.append('email', document.getElementById('email').value.trim());
      fd.append('password', document.getElementById('password').value);
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
          msg.className = 'msg success';
          msg.style.display = 'block';
          msg.textContent = '✔ Acesso autorizado! Redirecionando...';
          setTimeout(() => window.location.href = data.redirect || '/dashboard', 900);
        } else {
          msg.className = 'msg error';
          msg.style.display = 'block';
          msg.textContent = '✖ ' + (data.message || 'Credenciais inválidas.');
          btn.innerHTML = '<span class="btn-accent">⚡</span> ENTRAR';
          btn.disabled = false;
        }
      } catch {
        msg.className = 'msg error';
        msg.style.display = 'block';
        msg.textContent = '✖ Erro de conexão. Tente novamente.';
        btn.innerHTML = '<span class="btn-accent">⚡</span> ENTRAR';
        btn.disabled = false;
      }
    });
  </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
