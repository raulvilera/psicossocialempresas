<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login — Mental & Mais · Saúde Ocupacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --navy:#0B0B2E;--navy2:#151846;--ink:#181A33;--ink-soft:#565C7C;
      --paper:#F3F5FA;--surface:#FFFFFF;--line:#DEE2EE;
      --teal:#20C4C6;--teal-dark:#0E8B8D;--teal-tint:#E3FAFA;
      --pink:#E85D75;--pink-tint:#FDEBEF;
      --green:#2FA97A;--amber:#EDA23B;--red:#D6503F;
      --font-sans:'Inter',system-ui,sans-serif;
      --font-serif:'Lora','Georgia',serif;
    }
    body{
      font-family:var(--font-sans);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--paper);
      background-image:radial-gradient(ellipse at 20% 30%,rgba(11,11,46,.06) 0%,transparent 55%),
                       radial-gradient(ellipse at 80% 70%,rgba(32,196,198,.08) 0%,transparent 55%);
      padding:24px;
    }
    /* CARD */
    .card{
      position:relative;z-index:1;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:20px;
      padding:48px 44px 40px;
      width:100%;max-width:440px;
      box-shadow:0 8px 40px rgba(11,11,46,.10),0 2px 8px rgba(11,11,46,.06);
      animation:slideUp .45s ease both;
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

    /* MASTHEAD */
    .masthead{
      text-align:center;margin-bottom:32px;
    }
    .logo-badge{
      display:inline-flex;align-items:center;gap:7px;
      background:var(--navy);color:var(--teal);
      font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
      padding:5px 14px;border-radius:20px;margin-bottom:14px;
    }
    .logo-badge .dot{width:7px;height:7px;background:var(--teal);border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .masthead h1{
      font-family:var(--font-serif);
      font-size:30px;font-weight:600;color:var(--navy);margin-bottom:4px;
    }
    .masthead h1 em{color:var(--teal-dark);font-style:normal}
    .masthead .sub{font-size:13px;color:var(--ink-soft)}

    /* ROLE TABS */
    .role-tabs{
      display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
      margin-bottom:28px;background:var(--paper);border:1px solid var(--line);
      border-radius:12px;padding:5px;
    }
    .role-tab{
      padding:10px 4px;text-align:center;cursor:pointer;border-radius:8px;
      font-size:11px;font-weight:700;color:var(--ink-soft);
      letter-spacing:.8px;text-transform:uppercase;transition:all .2s;user-select:none;
    }
    .role-tab.active{background:var(--navy);color:var(--teal);box-shadow:0 2px 8px rgba(11,11,46,.18)}
    .role-tab .r-icon{display:block;font-size:17px;margin-bottom:3px}

    /* MSG */
    .msg{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;display:none}
    .msg.error{background:rgba(214,80,63,.1);color:var(--red);border:1px solid rgba(214,80,63,.25)}
    .msg.success{background:var(--teal-tint);color:var(--teal-dark);border:1px solid rgba(32,196,198,.3)}

    /* FIELDS */
    .field{margin-bottom:18px}
    label{font-size:11px;font-weight:700;color:var(--navy);display:block;margin-bottom:7px;letter-spacing:.8px;text-transform:uppercase}
    .input-wrap{
      position:relative;background:var(--paper);border:1.5px solid var(--line);
      border-radius:11px;display:flex;align-items:center;
      transition:border-color .2s,box-shadow .2s;
    }
    .input-wrap:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(32,196,198,.12)}
    .input-icon{position:absolute;left:13px;color:var(--ink-soft);flex-shrink:0}
    .input-wrap input{
      width:100%;padding:13px 13px 13px 42px;background:transparent;
      border:none;outline:none;font-size:14.5px;color:var(--ink);font-family:var(--font-sans);
    }
    .input-wrap input::placeholder{color:rgba(86,92,124,.45)}
    .toggle-pw{position:absolute;right:13px;cursor:pointer;color:var(--ink-soft);background:none;border:none;font-size:16px;transition:color .15s}
    .toggle-pw:hover{color:var(--teal-dark)}

    .forgot{text-align:right;margin-top:6px;margin-bottom:22px}
    .forgot a{color:var(--ink-soft);font-size:12px;text-decoration:none;transition:color .15s}
    .forgot a:hover{color:var(--teal-dark)}

    /* BOTÃO */
    .btn-primary{
      width:100%;padding:14px;
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:#fff;border:none;border-radius:12px;
      font-size:15px;font-weight:700;cursor:pointer;
      font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase;
      transition:all .25s;box-shadow:0 4px 16px rgba(11,11,46,.25);
    }
    .btn-primary:hover{background:linear-gradient(135deg,#1a1a50,#202070);box-shadow:0 6px 24px rgba(11,11,46,.35);transform:translateY(-1px)}
    .btn-primary:active{transform:translateY(0);box-shadow:0 2px 8px rgba(11,11,46,.2)}
    .btn-primary:disabled{opacity:.5;cursor:default;transform:none}
    .btn-primary .btn-accent{color:var(--teal)}

    .signup-link{text-align:center;margin-top:22px;font-size:13px;color:var(--ink-soft)}
    .signup-link a{color:var(--teal-dark);font-weight:600;text-decoration:none}
    .signup-link a:hover{color:var(--navy)}

    /* SOS */
    .sos-strip{
      display:flex;align-items:center;justify-content:center;gap:16px;
      margin-top:20px;padding:10px 14px;background:rgba(232,93,117,.06);
      border:1px solid rgba(232,93,117,.2);border-radius:10px;
    }
    .sos-strip .sos-title{font-size:11px;font-weight:700;color:var(--pink);text-transform:uppercase;letter-spacing:.8px}
    .sos-strip a{font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;background:var(--paper);padding:3px 9px;border-radius:6px;border:1px solid var(--line)}
    .sos-strip a:hover{background:var(--teal-tint);border-color:var(--teal)}

    /* dots anim */
    .dots::after{content:'';animation:dots 1.2s infinite}
    @keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
  </style>
</head>
<body>
  <div class="card">
    <!-- Masthead -->
    <div class="masthead">
      <div class="logo-badge"><span class="dot"></span> Mental &amp; Mais</div>
      <h1>S <em>Psicos</em></h1>
      <div class="sub">Plataforma de Saúde Ocupacional Psicossocial · IA Engine</div>
    </div>

    <!-- Abas de perfil — mantidas do original -->
    <div class="role-tabs">
      <div class="role-tab active" onclick="setRole('rh',this)" id="tab-rh">
        <span class="r-icon">🏢</span> RH
      </div>
      <div class="role-tab" onclick="setRole('consultor',this)" id="tab-consultor">
        <span class="r-icon">🧠</span> Consultor
      </div>
      <div class="role-tab" onclick="setRole('admin',this)" id="tab-admin">
        <span class="r-icon">⚙</span> Admin
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label>E-mail</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m2 7 10 7 10-7"/>
          </svg>
          <input type="email" id="email" placeholder="usuario@empresa.com.br" required autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()" title="Mostrar/ocultar senha">👁</button>
        </div>
      </div>
      <div class="forgot"><a href="#">Esqueci minha senha</a></div>
      <button type="submit" class="btn-primary" id="btn-login">
        <span class="btn-accent">⚡</span> ENTRAR
      </button>
    </form>

    <p class="signup-link">Não tem conta? <a href="/signup">Criar conta</a> &nbsp;|&nbsp; <a href="/cadastro-empresa">Cadastrar empresa</a></p>

    <!-- Canal de Escuta / SOS -->
    <div class="sos-strip">
      <span class="sos-title">🆘 Ajuda urgente</span>
      <a href="tel:188" title="Centro de Valorização da Vida">CVV 188</a>
      <a href="tel:192" title="SAMU">SAMU 192</a>
      <a href="tel:100" title="Disque Direitos Humanos">Disque 100</a>
    </div>
  </div>

  <script>
    let currentRole = 'rh';
    function setRole(role, el) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('msg');
      btn.innerHTML = '<span class="btn-accent">⚡</span> <span class="dots">Verificando</span>';
      btn.disabled = true;
      msg.style.display = 'none';
      const fd = new FormData();
      fd.append('email', document.getElementById('email').value.trim());
      fd.append('password', document.getElementById('password').value);
      fd.append('role', currentRole);
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
          msg.className = 'msg success';
          msg.style.display = 'block';
          msg.textContent = '✔ Acesso autorizado! Redirecionando...';
          setTimeout(() => window.location.href = data.redirect || '/dashboard', 900);
        } else {
          msg.className = 'msg error';
          msg.style.display = 'block';
          msg.textContent = '✖ ' + (data.message || 'Credenciais inválidas.');
          btn.innerHTML = '<span class="btn-accent">⚡</span> ENTRAR';
          btn.disabled = false;
        }
      } catch {
        msg.className = 'msg error';
        msg.style.display = 'block';
        msg.textContent = '✖ Erro de conexão. Tente novamente.';
        btn.innerHTML = '<span class="btn-accent">⚡</span> ENTRAR';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
