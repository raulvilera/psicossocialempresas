<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Criar Conta — Mental & Mais · S Psicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0B0B2E;
      --navy2: #151846;
      --ink: #181A33;
      --ink-soft: #565C7C;
      --paper: #F3F5FA;
      --surface: #FFFFFF;
      --line: #DEE2EE;
      --teal: #20C4C6;
      --teal-dark: #0E8B8D;
      --teal-tint: #E3FAFA;
      --pink: #E85D75;
      --pink-tint: #FDEBEF;
      --green: #2FA97A;
      --amber: #EDA23B;
      --red: #D6503F;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Lora', 'Georgia', serif;
    }

    body {
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      overflow-y: auto;
      padding: 20px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(145deg, #07091d, #02030a) !important;
      border: 1.5px solid #20C4C6 !important;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .8), 0 0 16px rgba(32, 196, 198, .2) !important;
      animation: up .45s ease both;
    }

    .card, .card * {
      color: #ffffff !important;
      font-weight: 700 !important;
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(32, 196, 198, .15);
      border: 1.5px solid #20C4C6;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .logo-title {
      font-family: var(--font-serif);
      font-size: 26px;
      letter-spacing: .2px;
    }

    .logo-sub {
      font-size: 13px;
      margin-top: 4px;
      opacity: .9;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      font-size: 11px;
      display: block;
      margin-bottom: 6px;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .iw {
      position: relative;
      background: #03050e;
      border: 1.5px solid #20C4C6;
      border-radius: 11px;
      display: flex;
      align-items: center;
      transition: border-color .2s, box-shadow .2s;
    }

    .iw:focus-within {
      border-color: #38df9f;
      box-shadow: 0 0 12px rgba(32, 196, 198, .4);
    }

    .iw-icon {
      position: absolute;
      left: 13px;
      flex-shrink: 0;
    }

    .iw input,
    .iw select {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: var(--font-sans);
    }

    .iw input::placeholder {
      color: rgba(255, 255, 255, .5) !important;
    }

    .iw select option {
      background: #03050e;
      color: #ffffff;
    }

    .msg {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .msg.error {
      background: rgba(214, 80, 63, .25);
      border: 1.5px solid #ff6666;
    }

    .msg.success {
      background: rgba(32, 196, 198, .25);
      border: 1.5px solid #20C4C6;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-sans);
      letter-spacing: .5px;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(32, 196, 198, .4);
      transition: all .2s;
      margin-top: 10px;
    }

    .btn, .btn * {
      color: #000000 !important;
    }

    .btn:hover {
      background: #3be2e4;
      border-color: #3be2e4;
      box-shadow: 0 0 22px rgba(32, 196, 198, .7);
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
      transform: none;
    }

    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .link a {
      text-decoration: underline;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-badge">&#128737; Mental &amp; Mais</div>
      <div class="logo-title">Criar Conta</div>
      <div class="logo-sub">Cadastro de acesso corporativo à plataforma</div>
    </div>
    <div class="msg" id="msg"></div>
    <form id="form">
      <div class="field">
        <label>Nome Completo</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4" />
            <path d="M5.5 21a8.38 8.38 0 0 1 13 0" />
          </svg>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>
      </div>
      <div class="field">
        <label>E-mail Corporativo</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m2 7 10 7 10-7" />
          </svg>
          <input type="email" id="email" placeholder="seu@empresa.com.br" required>
        </div>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
        </div>
      </div>
      <div class="field">
        <label>ID da Empresa</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="2" y="7" width="20" height="15" rx="2" />
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
          </svg>
          <input type="number" id="empresa_id" placeholder="Ex: 1" required min="1">
        </div>
      </div>
      <button type="submit" class="btn" id="btn-cad">&#10003; CADASTRAR</button>
    </form>
    <p class="link">Já tem conta? <a href="/login">Fazer login</a></p>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-cad');
      const msg = document.getElementById('msg');
      btn.textContent = 'PROCESSANDO...'; btn.disabled = true;
      const fd = new FormData();
      ['nome', 'email', 'password', 'empresa_id'].forEach(id => fd.append(id, document.getElementById(id).value));
      try {
        const res = await fetch('/api/auth/signup', { method: 'POST', body: fd });
        const data = await res.json();
        msg.style.display = 'block';
        if (data.success) {
          msg.className = 'msg success'; msg.textContent = '✓ ' + data.message;
          setTimeout(() => window.location.href = '/login', 2000);
        } else {
          msg.className = 'msg error'; msg.textContent = '✗ ' + (data.message || 'Erro.');
          btn.textContent = '✓ CADASTRAR'; btn.disabled = false;
        }
      } catch {
        msg.className = 'msg error'; msg.style.display = 'block'; msg.textContent = '✗ Erro de conexão.';
        btn.textContent = '✓ CADASTRAR'; btn.disabled = false;
      }
    });
  </script>
</body>

</html>
