<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0077ff">
  <link rel="icon" href="/static/app_icon.png">
  <link rel="apple-touch-icon" href="/static/app_icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mental Mais">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Cadastrar Empresa — Mental Mais</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0B0B2E;
      --navy2: #151846;
      --ink: #181A33;
      --ink-soft: #565C7C;
      --paper: #F3F5FA;
      --surface: #FFFFFF;
      --line: #DEE2EE;
      --teal: #20C4C6;
      --teal-dark: #0E8B8D;
      --teal-tint: #E3FAFA;
      --pink: #E85D75;
      --pink-tint: #FDEBEF;
      --green: #2FA97A;
      --amber: #EDA23B;
      --red: #D6503F;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Lora', 'Georgia', serif;
    }

    body {
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      overflow-y: auto;
      padding: 24px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(145deg, #07091d, #02030a) !important;
      border: 1.5px solid #20C4C6 !important;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .8), 0 0 16px rgba(32, 196, 198, .2) !important;
      animation: up .45s ease both;
    }

    .card, .card * {
      color: #ffffff !important;
      font-weight: 700 !important;
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(32, 196, 198, .15);
      border: 1.5px solid #20C4C6;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .logo-title {
      font-family: var(--font-serif);
      font-size: 26px;
      letter-spacing: .2px;
    }

    .logo-sub {
      font-size: 13px;
      margin-top: 4px;
      opacity: .9;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 500px) {
      .grid2 { grid-template-columns: 1fr; }
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      font-size: 11px;
      display: block;
      margin-bottom: 6px;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .iw {
      position: relative;
      background: #03050e;
      border: 1.5px solid #20C4C6;
      border-radius: 11px;
      display: flex;
      align-items: center;
      transition: border-color .2s, box-shadow .2s;
    }

    .iw:focus-within {
      border-color: #38df9f;
      box-shadow: 0 0 12px rgba(32, 196, 198, .4);
    }

    .iw-icon {
      position: absolute;
      left: 13px;
      flex-shrink: 0;
    }

    .iw input,
    .iw textarea {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: var(--font-sans);
    }

    .iw input::placeholder,
    .iw textarea::placeholder {
      color: rgba(255, 255, 255, .5) !important;
    }

    .msg {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .msg.error {
      background: rgba(214, 80, 63, .25);
      border: 1.5px solid #ff6666;
    }

    .msg.success {
      background: rgba(32, 196, 198, .25);
      border: 1.5px solid #20C4C6;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-sans);
      letter-spacing: .5px;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(32, 196, 198, .4);
      transition: all .2s;
      margin-top: 10px;
    }

    .btn, .btn * {
      color: #000000 !important;
    }

    .btn:hover {
      background: #3be2e4;
      border-color: #3be2e4;
      box-shadow: 0 0 22px rgba(32, 196, 198, .7);
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
      transform: none;
    }

    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .link a {
      text-decoration: underline;
    }

    .link a:hover {
      text-decoration: underline;
    }

    /* CHECKLIST DE SETORES */
    .setores-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 500px) {
      .setores-grid { grid-template-columns: 1fr; }
    }

    .setor-chip {
      display: flex !important;
      align-items: center;
      gap: 8px;
      background: #03050e;
      border: 1.5px solid rgba(32, 196, 198, .4);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px !important;
      text-transform: none !important;
      letter-spacing: 0 !important;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .setor-chip:hover {
      border-color: var(--teal);
    }

    .setor-chip input {
      width: 15px;
      height: 15px;
      accent-color: var(--teal);
      cursor: pointer;
      flex-shrink: 0;
    }

    .setor-chip.checked {
      background: rgba(32, 196, 198, .18);
      border-color: var(--teal);
    }

    .setores-erro {
      display: none;
      color: #ff6666 !important;
      font-size: 11.5px !important;
      margin-top: 8px;
      text-transform: none !important;
      letter-spacing: 0 !important;
    }

    /* TELA DE LINKS POR SETOR (pós-cadastro) */
    #linksBox { display: none; }

    .setor-link-item {
      background: #03050e;
      border: 1.5px solid rgba(32, 196, 198, .4);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .setor-link-nome {
      font-size: 13px !important;
      margin-bottom: 8px;
    }

    .setor-link-iw input {
      font-size: 11.5px !important;
      padding: 10px 12px !important;
      font-weight: 500 !important;
    }

    .setor-link-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-mini {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      background: transparent;
      border: 1.5px solid var(--teal);
      border-radius: 20px;
      font-size: 11px !important;
      text-transform: uppercase;
      letter-spacing: .4px;
      cursor: pointer;
      text-decoration: none !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      transition: all .15s;
    }

    .btn-mini:hover {
      background: rgba(32, 196, 198, .18);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-badge">&#127970; Mental Mais</div>
      <div class="logo-title">Cadastrar Empresa</div>
      <div class="logo-sub">Registre sua organização na plataforma de saúde psicossocial</div>
    </div>
    <div class="msg" id="msg"></div>
    <form id="form">
      <div class="field">
        <label>CNPJ</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M8 2v4M16 2v4M3 10h18" />
          </svg>
          <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required maxlength="18">
        </div>
      </div>
      <div class="field">
        <label>Razão Social</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <rect x="2" y="7" width="20" height="15" rx="2" />
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
          </svg>
          <input type="text" id="nome" placeholder="Nome da empresa" required>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Telefone</label>
          <div class="iw">
            <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 11.9 19.79 19.79 0 0 1 1.61 3.26 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            <input type="text" id="telefone" placeholder="(11) 99999-9999" required>
          </div>
        </div>
        <div class="field">
          <label>Nº Colaboradores</label>
          <div class="iw">
            <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <input type="number" id="colaboradores" placeholder="50" required min="1">
          </div>
        </div>
      </div>
      <div class="field">
        <label>Responsável SESMT / RH</label>
        <div class="iw">
          <svg class="iw-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4" />
            <path d="M5.5 21a8.38 8.38 0 0 1 13 0" />
          </svg>
          <input type="text" id="responsavel" placeholder="Nome do responsável" required>
        </div>
      </div>
      <div class="field">
        <label>Setores da Empresa</label>
        <div class="setores-grid" id="setoresGrid">
          <label class="setor-chip"><input type="checkbox" value="Produção"> Produção</label>
          <label class="setor-chip"><input type="checkbox" value="Administrativo"> Administrativo</label>
          <label class="setor-chip"><input type="checkbox" value="Recursos Humanos"> Recursos Humanos</label>
          <label class="setor-chip"><input type="checkbox" value="Logística"> Logística</label>
          <label class="setor-chip"><input type="checkbox" value="Comercial / Vendas"> Comercial / Vendas</label>
          <label class="setor-chip"><input type="checkbox" value="Financeiro"> Financeiro</label>
          <label class="setor-chip"><input type="checkbox" value="TI / Sistemas"> TI / Sistemas</label>
          <label class="setor-chip"><input type="checkbox" value="Manutenção"> Manutenção</label>
          <label class="setor-chip"><input type="checkbox" value="Qualidade"> Qualidade</label>
          <label class="setor-chip"><input type="checkbox" value="Diretoria / Gestão"> Diretoria / Gestão</label>
          <label class="setor-chip"><input type="checkbox" value="Atendimento"> Atendimento</label>
          <label class="setor-chip"><input type="checkbox" id="chkOutroSetor"> Outro</label>
        </div>
        <div class="iw" id="outroSetorWrap" style="display:none;margin-top:8px">
          <input type="text" id="setorOutro" placeholder="Digite outro(s) setor(es), separados por vírgula">
        </div>
        <div class="setores-erro" id="setoresErro">⚠ Selecione ao menos um setor.</div>
      </div>
      <button type="submit" class="btn" id="btn">&#10003; CADASTRAR EMPRESA</button>
    </form>

    <div id="linksBox"></div>

    <p class="link" id="footerLinks"><a href="/dashboard">&#8592; Voltar ao Dashboard</a> &nbsp;|&nbsp; <a href="/login">Login</a></p>
  </div>
  <script>
    // Realça visualmente o chip quando marcado + mostra campo "Outro"
    document.querySelectorAll('.setor-chip input[type=checkbox]').forEach(chk => {
      chk.addEventListener('change', () => {
        chk.closest('.setor-chip').classList.toggle('checked', chk.checked);
        if (chk.id === 'chkOutroSetor') {
          document.getElementById('outroSetorWrap').style.display = chk.checked ? 'block' : 'none';
        }
      });
    });

    // Coleta os setores marcados no checklist + os digitados em "Outro"
    function coletarSetores() {
      const marcados = Array.from(document.querySelectorAll('#setoresGrid input[type=checkbox]:checked'))
        .filter(c => c.id !== 'chkOutroSetor')
        .map(c => c.value);
      const outro = document.getElementById('setorOutro').value.trim();
      if (outro) outro.split(',').map(s => s.trim()).filter(Boolean).forEach(s => marcados.push(s));
      return [...new Set(marcados)];
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const setoresErro = document.getElementById('setoresErro');

      const setores = coletarSetores();
      if (setores.length === 0) {
        setoresErro.style.display = 'block';
        return;
      }
      setoresErro.style.display = 'none';

      btn.textContent = 'PROCESSANDO...'; btn.disabled = true;
      const fd = new FormData();
      ['cnpj', 'nome', 'telefone', 'responsavel', 'colaboradores'].forEach(id => fd.append(id, document.getElementById(id).value));
      fd.append('setores', setores.join(', '));

      try {
        const res = await fetch('/api/empresa/registrar', { method: 'POST', body: fd });
        const data = await res.json();
        msg.style.display = 'block';
        if (data.success) {
          msg.className = 'msg success'; msg.textContent = '✓ ' + data.message;
          const empresaId = data.empresa && data.empresa.id;
          if (empresaId) {
            mostrarLinksSetores(empresaId, setores);
          } else {
            setTimeout(() => window.location.href = '/dashboard', 1500);
          }
        } else {
          msg.className = 'msg error'; msg.textContent = '✗ ' + (data.message || 'Erro.');
          btn.textContent = '✓ CADASTRAR EMPRESA'; btn.disabled = false;
        }
      } catch {
        msg.className = 'msg error'; msg.style.display = 'block'; msg.textContent = '✗ Erro de conexão.';
        btn.textContent = '✓ CADASTRAR EMPRESA'; btn.disabled = false;
      }
    });

    // Gera e exibe o link do questionário (DRPS) já direcionado para cada setor selecionado
    function mostrarLinksSetores(empresaId, setores) {
      document.getElementById('form').style.display = 'none';
      document.getElementById('footerLinks').style.display = 'none';

      const base = window.location.origin;
      const box = document.getElementById('linksBox');
      box.style.display = 'block';

      const itens = setores.map(s => {
        const link = `${base}/questionario?empresa_id=${empresaId}&setor=${encodeURIComponent(s)}`;
        const linkSeguro = link.replace(/'/g, "\\'");
        const whatsTxt = encodeURIComponent(`Responda o diagnóstico psicossocial (setor ${s}): ${link}`);
        return `
          <div class="setor-link-item">
            <div class="setor-link-nome">🏭 ${s}</div>
            <div class="iw setor-link-iw"><input type="text" readonly value="${link}"></div>
            <div class="setor-link-actions">
              <button type="button" class="btn-mini" onclick="copiarSetorLink('${linkSeguro}', this)">📋 Copiar</button>
              <a class="btn-mini" target="_blank" rel="noopener" href="https://wa.me/?text=${whatsTxt}">📲 WhatsApp</a>
            </div>
          </div>`;
      }).join('');

      box.innerHTML = `
        <div class="logo-sub" style="margin-bottom:14px;text-align:center">
          Envie o link de cada setor para os colaboradores responderem o diagnóstico:
        </div>
        ${itens}
        <button type="button" class="btn" onclick="window.location.href='/dashboard'" style="margin-top:6px">
          IR PARA O DASHBOARD →
        </button>`;
    }

    function copiarSetorLink(link, el) {
      navigator.clipboard.writeText(link).then(() => {
        const original = el.textContent;
        el.textContent = '✓ Copiado!';
        setTimeout(() => { el.textContent = original; }, 1500);
      });
    }

    // Máscara CNPJ
    document.getElementById('cnpj').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').substring(0, 14);
      v = v.replace(/(\d{2})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
      this.value = v;
    });
  </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>

</html>
