<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0077ff">
  <link rel="icon" href="/static/app_icon.png">
  <link rel="apple-touch-icon" href="/static/app_icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mental Mais">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Painel Profissional — Mental Mais</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    /* scrollbar customizada azul */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3)
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 119, 255, 0.5);
      border-radius: 4px;
      border: 2px solid #02060a
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 204, 255, 0.8)
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0B0B2E;
      color: #ffffff;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #0B0B2E;
      border-right: 1px solid rgba(32, 196, 198, 0.2);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(32, 196, 198, 0.2);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(32, 196, 198, 0.15);
      border: 1px solid #20C4C6;
      color: #20C4C6;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .sidebar h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .sidebar h2 em {
      color: #20C4C6;
      font-style: normal;
    }

    .sidebar-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 3px 10px;
      padding: 11px 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      transition: all .15s;
    }

    .nav-item.active {
      color: #fff;
      background: rgba(32, 196, 198, 0.25);
      border-color: #20C4C6;
      box-shadow: 0 0 15px rgba(32, 196, 198, 0.3);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(200, 0, 0, 0.4);
      background: rgba(200, 0, 0, 0.15);
      color: #ff9999;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100vh;
      background: #0B0B2E;
    }

    .topbar {
      background: #0B0B2E;
      border-bottom: 1px solid rgba(32, 196, 198, 0.2);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      flex: 1;
    }

    .content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #0B0B2E;
    }

    .page-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* CARDS AZUL CLARO / PRETO E TEXTO BRANCO EM NEGRITO */
    .kpi-card, .table-card {
      background: linear-gradient(145deg, #07091d, #02030a) !important;
      border: 1.5px solid #20C4C6 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65), 0 0 14px rgba(32, 196, 198, 0.18) !important;
      border-radius: 14px;
    }

    .kpi-card *, .table-card * {
      color: #ffffff !important;
      font-weight: 700 !important;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      padding: 20px;
      text-align: center;
    }

    .kpi-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .kpi-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 38px;
      margin-top: 4px;
    }

    .table-card {
      overflow: hidden;
    }

    .table-header {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(32, 196, 198, 0.3);
      background: rgba(32, 196, 198, 0.1);
    }

    .table-header h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: rgba(32, 196, 198, 0.15);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1.5px solid rgba(32, 196, 198, 0.3);
    }

    td {
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    tr:hover td {
      background: rgba(32, 196, 198, 0.1);
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge">🧠 Mental Mais</div>
      <h2>Painel<br><em>Profissional</em></h2>
      <div class="sidebar-sub">Área Restrita</div>
    </div>
    <div style="margin-top:12px">
      <div class="nav-item active"><span>📊</span> Visão Geral</div>
      <div class="nav-item"><span>🏢</span> Empresas</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="window.location.href='/login'">🚪 Sair do Sistema</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>PAINEL PROFISSIONAL</h1>
    </div>
    <div class="content">
      <div class="page-title">VISÃO GERAL</div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon">🏢</div>
          <div class="kpi-label">Empresas</div>
          <div class="kpi-value" id="te">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon">👥</div>
          <div class="kpi-label">Colaboradores</div>
          <div class="kpi-value" id="tf" style="color:#66aaff">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon">⚠️</div>
          <div class="kpi-label">Alto Risco</div>
          <div class="kpi-value" id="tr" style="color:#ff6060">—</div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <h3>📋 Empresas Cadastradas</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Empresa</th>
              <th>CNPJ</th>
              <th>Funcionários</th>
              <th>Alto Risco</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="lista">
            <tr>
              <td colspan="5" style="text-align:center;padding:24px;color:rgba(200,0,255,0.2)">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    async function load() {
      const empresas = await fetch('/api/empresas').then(r => r.json());
      document.getElementById('te').textContent = empresas.length;
      let tf = 0, tr = 0;
      const rows = await Promise.all(empresas.map(async e => {
        const d = await fetch(`/api/dashboard/${e.id}`).then(r => r.json());
        tf += d.kpis.total_funcionarios; tr += d.kpis.alto_risco;
        return `<tr><td style="font-weight:600;color:#e0f0ff">${e.nome}</td><td style="color:#888">${e.cnpj || '—'}</td><td>${d.kpis.total_funcionarios}</td><td style="color:#ff6060;font-weight:700">${d.kpis.alto_risco}</td><td style="color:#0077ff;font-weight:700">${d.kpis.score_seguranca}%</td></tr>`;
      }));
      document.getElementById('tf').textContent = tf;
      document.getElementById('tr').textContent = tr;
      document.getElementById('lista').innerHTML = rows.join('') || '<tr><td colspan="5" style="text-align:center;padding:16px;color:rgba(200,0,255,0.2)">Nenhuma empresa</td></tr>';
    }
    load();
  </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>

</html>
